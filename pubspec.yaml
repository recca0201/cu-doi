name: ban_bua_tuong
description: "Bắn Bừa — Cú Dội: game bắn dội tường. Trúng thẳng không tính."
publish_to: 'none'
version: 0.1.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  characters: ^1.4.0
  crypto: ^3.0.6
  path: ^1.9.1
  path_provider: ^2.1.5
  image: ^4.5.4
  image_picker: ^1.1.2
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_app_check: ^0.4.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  cloud_functions: ^6.0.0
  google_sign_in: ^7.1.1
  google_mobile_ads: ^9.1.0

  # Reused verbatim from ban_bua for lib/core/game_audio_service.dart. Pulls in
  # `flame` transitively, but no Flame game loop is used — rendering is a plain
  # CustomPainter driven by a Ticker, which is what the prototype validated.
  flame_audio: ^2.12.1

  # Rewarded ads are opt-in and only fund hint coins. QA uses Google's test
  # units; production IDs must be supplied explicitly for release builds.

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true # App Store rejects an icon with an alpha channel.
  image_path_ios_dark_transparent: "assets/icon/app_icon_dark.png"
  image_path_ios_tinted_grayscale: "assets/icon/app_icon_tinted.png"

flutter:
  uses-material-design: true
  generate: true
  licenses:
    - assets/fonts/OFL-Baloo2.txt
    - assets/fonts/OFL-Nunito.txt
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf

  assets:
    - assets/audio/
    - assets/images/brand/
    - assets/images/backgrounds/
    - assets/images/mascot/
    - assets/images/mascot/moods/
    - assets/images/auth/
    - assets/images/ui/galaxy/
    - assets/images/ui/karst/
